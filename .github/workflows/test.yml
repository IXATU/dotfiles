name: test

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install test tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt yamllint python3 python3-yaml bats zsh gitleaks

      - name: MCP governance
        run: make ai-mcp-governance

      - name: Secret scan (gitleaks)
        run: make security-gitleaks

      - name: Python quality tooling
        run: |
          python3 -m pip install --break-system-packages ruff ty pyright
          ruff check --select E4,E7,E9,F scripts tests/python
          ty check scripts/update/parse-winget-log.py
          pyright scripts/update/parse-winget-log.py

      - name: CI test suite
        run: make test-ci
